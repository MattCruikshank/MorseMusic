<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morse Music</title>
  <meta name="description" content="Turn any text into Morse code sheet music for flute, cello or piano, and play it back.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <h1>Morse <span>Music</span></h1>
    <p class="tagline">Any text, spelled out in Morse code as notes for flute, cello or piano.</p>
  </header>

  <main>
    <section class="panel controls" aria-label="Settings">
      <label class="field text-field">
        <span>Text</span>
        <input id="text" type="text" value="Matthew Cruikshank" autocomplete="off" spellcheck="false">
      </label>
      <label class="field"><span>Instrument</span><select id="instrument"></select></label>
      <label class="field"><span>Key</span><select id="key"></select></label>
      <label class="field"><span>Scale</span><select id="scale"></select></label>
      <label class="field wide"><span>Melody</span><select id="pattern"></select></label>
      <label class="field wide"><span>Rhythm</span><select id="rhythm"></select></label>
      <label class="field"><span>Time</span><select id="timeSig">
        <option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option>
      </select></label>
      <label class="field tempo">
        <span>Tempo <output id="bpmOut">96</output> bpm</span>
        <input id="bpm" type="range" min="50" max="180" step="2" value="96">
      </label>
    </section>

    <section class="transport">
      <button id="play" class="play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-play" d="M8 5.5v13l11-6.5z"/><path class="icon-stop" d="M7 7h10v10H7z"/></svg>
        <span class="label">Play</span>
      </button>
      <button id="print" class="print" type="button" title="Print, or save as PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5H7zM5 9h14a2 2 0 0 1 2 2v6h-4v4H7v-4H3v-6a2 2 0 0 1 2-2zm4 7v3h6v-3z"/></svg>
        <span>Print</span>
      </button>
      <div id="morseStrip" class="morse-strip" aria-label="Morse code"></div>
    </section>

    <section class="sheet">
      <div class="sheet-head">
        <h2 id="sheetTitle">Matthew Cruikshank</h2>
        <p id="sheetSub" class="sheet-sub"></p>
      </div>
      <div id="score" class="score"></div>
      <p id="warning" class="warning" hidden></p>
    </section>

    <section class="explain">
      <div>
        <h3>Rhythm</h3>
        <p id="rhythmText"></p>
      </div>
      <div>
        <h3>Melody</h3>
        <p id="patternText"></p>
      </div>
      <div>
        <h3>Instrument</h3>
        <p id="instText"></p>
      </div>
    </section>
    <p class="hint">Tip: click a letter (in the strip above or under the staff) to start playing from there. Settings are saved in the page address, so you can bookmark or share it.</p>
  </main>

  <script src="lib/vexflow.js"></script>
  <script src="js/morse.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/score.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
